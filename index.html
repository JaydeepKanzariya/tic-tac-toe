<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e11d48'/%3E%3Cpath d='M10 10l12 12M22 10L10 22' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A two-player Tic Tac Toe game with a scoreboard, alternating rounds and full keyboard support."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tic Tac Toe" />
    <meta
      property="og:description"
      content="A two-player Tic Tac Toe game with a scoreboard, alternating rounds and full keyboard support."
    />
    <meta property="og:url" content="https://tic-tac-toe-psi-nine-94.vercel.app/" />
    <meta property="og:image" content="https://tic-tac-toe-psi-nine-94.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tic Tac Toe board with X winning on the diagonal" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var theme = localStorage.getItem('tic-tac-toe:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (error) {
        // Storage unavailable: follow the system theme.
      }
    </script>
    <title>Tic Tac Toe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
